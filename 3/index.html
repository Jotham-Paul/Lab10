<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Age Verification</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        .form-row {
            margin-bottom: 12px;
        }
        input[type="text"], input[type="number"] {
            padding: 6px;
            font-size: 14px;
        }
        input[type="submit"] {
            padding: 6px 14px;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>Age Verification</h2>

    <form action="verify.php" method="POST" onsubmit="let p=location.pathname; if(!p.endsWith('.html')&&!p.endsWith('.php')&&!p.endsWith('/')) this.action=p+'/verify.php';">
        <div class="form-row">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
        </div>
        <div class="form-row">
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" required>
        </div>
        <input type="submit" value="Submit">
    </form>

</body>
</html>
